# Caching reverse proxy for functional tests (see `make download-cache-start`). Test containers
# resolve the upstream hostnames to this container via --add-host and trust the generated test CA,
# so the buildpack, curl, npm, pnpm, and yarn all hit this cache instead of the internet.
worker_processes auto;

events {
	worker_connections 1024;
}

http {
	log_format cache '$upstream_cache_status $status $host$request_uri $body_bytes_sent ${request_time}s';
	access_log /dev/stdout cache;

	proxy_cache_path /cache levels=1:2 keys_zone=downloads:50m max_size=20g inactive=30d use_temp_path=off;

	ssl_certificate /certs/server.pem;
	ssl_certificate_key /certs/server.key;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	# Request identity encoding upstream so a cached response can be served to any client.
	proxy_set_header Accept-Encoding "";
	proxy_ssl_server_name on;
	proxy_ssl_verify on;
	proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

	proxy_cache downloads;
	# npm and pnpm request abbreviated packuments via the Accept header from the same URL as the full one.
	proxy_cache_key "$host$request_uri $http_accept";
	proxy_cache_lock on;
	proxy_cache_lock_timeout 5m;
	# Default is 5s; slow downloads of large Node.js tarballs would otherwise let concurrent
	# requests start duplicate upstream fetches.
	proxy_cache_lock_age 5m;
	proxy_cache_revalidate on;
	proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
	proxy_ignore_headers Cache-Control Expires Set-Cookie;
	# Metadata (packuments, index files) can change; tarballs are immutable.
	proxy_cache_valid 200 1h;
	proxy_read_timeout 5m;

	server {
		listen 443 ssl;
		server_name registry.npmjs.org;
		location / {
			proxy_pass https://registry.npmjs.org;
		}
		location ~ \.tgz$ {
			proxy_pass https://registry.npmjs.org;
			proxy_cache_valid 200 30d;
		}
	}

	server {
		listen 443 ssl;
		server_name registry.yarnpkg.com;
		location / {
			proxy_pass https://registry.yarnpkg.com;
		}
		location ~ \.tgz$ {
			proxy_pass https://registry.yarnpkg.com;
			proxy_cache_valid 200 30d;
		}
	}

	server {
		listen 443 ssl;
		server_name nodejs.org;
		location / {
			proxy_pass https://nodejs.org;
		}
		location /download/release/ {
			proxy_pass https://nodejs.org;
			proxy_cache_valid 200 30d;
		}
	}
}
