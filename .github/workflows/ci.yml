name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install shfmt
        run: |
          SHFMT_VERSION=v3.13.0
          curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/shfmt
      - name: Lint migrated files
        run: make lint

  unit-test:
    runs-on: ubuntu-24.04
    container:
      image: heroku/heroku:${{ matrix.stack_number }}-build
      options: --user root
    strategy:
      matrix:
        stack_number: ["22", "24", "26"]
    env:
      STACK: heroku-${{ matrix.stack_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Unit tests on heroku:${{ matrix.stack_number }}-build
        run: test/unit

  functional-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack_number: ["22", "24", "26"]
    env:
      DOWNLOAD_CACHE_DIR: /home/runner/download-cache
      STACK_NUMBER: ${{ matrix.stack_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore download cache
        id: restore-download-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DOWNLOAD_CACHE_DIR }}
          key: download-cache-${{ hashFiles('inventory/node.toml', 'test/fixtures/**/package.json') }}
          restore-keys: download-cache-
      # nginx (uid 101) must be able to read cache files restored by the runner user.
      - name: Start download cache
        run: |
          mkdir -p "${DOWNLOAD_CACHE_DIR}"
          sudo chmod -R a+rwX "${DOWNLOAD_CACHE_DIR}"
          make download-cache-start
      - name: Functional tests on heroku:${{ matrix.stack_number }}-build
        run: make -k -j4 DOWNLOAD_CACHE=1 "heroku-${STACK_NUMBER}-build"
      # nginx writes cache files as 0600 owned by its own user; the runner user must own them to save.
      - name: Stop download cache
        if: always()
        run: |
          make download-cache-stop
          sudo chown -R "$(id -u):$(id -g)" "${DOWNLOAD_CACHE_DIR}"
      - name: Save download cache
        if: always() && steps.restore-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DOWNLOAD_CACHE_DIR }}
          key: ${{ steps.restore-download-cache.outputs.cache-primary-key }}

  hatchet-test:
    runs-on: ubuntu-24.04
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_API_USER: ${{ secrets.HEROKU_API_USER }}
      HATCHET_EXPENSIVE_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run hatchet tests
        run: make hatchet

  metrics-test:
    strategy:
      fail-fast: false
      matrix:
        # check the minimum node version supported by the metrics script and the latest node version
        # (assumes the versions between have backwards-compatible APIs)
        include:
          - version: 14.10.0
            mocha: 10.x
          - version: latest
            mocha: 11.x
    name: Test Metrics (${{ matrix.version }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}
      - run: npx mocha@${{ matrix.mocha }} metrics/test/metrics.spec.cjs

  rust-test:
    name: Rust Tests and Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --manifest-path ./resolve-version/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path ./resolve-version/Cargo.toml --all-targets --locked -- --deny warnings

  yarn-plugin-test:
    name: Yarn Plugin Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        working-directory: yarn2-plugins/prune-dev-dependencies
        run: npm ci
      - name: Run tests
        working-directory: yarn2-plugins/prune-dev-dependencies
        run: npm test
      - name: Verify bundle is up-to-date
        working-directory: yarn2-plugins/prune-dev-dependencies
        run: git diff --exit-code bundles/@yarnpkg/plugin-prune-dev-dependencies.js
